{{/* Explicit versioned favicon declaration to bypass aggressive browser caching. */}}
<link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon-euler.png?v=3" | relURL }}">
<link rel="shortcut icon" type="image/png" href="{{ "favicon-euler.png?v=3" | relURL }}">
<link rel="apple-touch-icon" href="{{ "favicon-euler.png?v=3" | relURL }}">
{{ if eq .Type "maps" }}
<link rel="stylesheet" href="{{ "vendor/photoswipe-5.4.4/photoswipe.css" | relURL }}">
{{ $mapsCSS := resources.Get "css/maps.css" | fingerprint }}
<link rel="stylesheet" href="{{ $mapsCSS.RelPermalink }}" integrity="{{ $mapsCSS.Data.Integrity }}">
{{ end }}
